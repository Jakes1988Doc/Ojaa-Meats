<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ojaa Meats — Performance Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --green:   #2d6a2d;
    --green2:  #3d8c3d;
    --lime:    #a8e063;
    --dark:    #0e1a0e;
    --card:    #141f14;
    --card2:   #1a2b1a;
    --border:  #2a3d2a;
    --text:    #e8f5e8;
    --muted:   #7a9e7a;
    --red:     #e05c5c;
    --amber:   #f0b429;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--dark);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse 80% 50% at 20% 0%, rgba(45,106,45,0.15) 0%, transparent 60%),
      radial-gradient(ellipse 60% 40% at 80% 100%, rgba(168,224,99,0.05) 0%, transparent 50%);
    pointer-events: none;
    z-index: 0;
  }
  .wrapper { position: relative; z-index: 1; max-width: 1400px; margin: 0 auto; padding: 0 24px 60px; }
  header {
    display: flex; align-items: flex-end; justify-content: space-between;
    padding: 40px 0 32px; border-bottom: 1px solid var(--border); margin-bottom: 36px;
  }
  .brand { display: flex; flex-direction: column; gap: 4px; }
  .brand-name { font-family: 'Bebas Neue', sans-serif; font-size: clamp(2.4rem, 5vw, 4rem); letter-spacing: 0.04em; color: var(--text); line-height: 1; }
  .brand-name span { color: var(--lime); }
  .brand-sub { font-size: 0.78rem; letter-spacing: 0.15em; text-transform: uppercase; color: var(--muted); }
  .header-right { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
  #last-updated { font-size: 0.72rem; color: var(--muted); font-family: 'DM Mono', monospace; }
  #refresh-btn {
    background: var(--green); border: none; color: white; padding: 8px 18px;
    border-radius: 6px; font-family: 'DM Sans', sans-serif; font-size: 0.82rem;
    font-weight: 500; cursor: pointer; transition: background 0.2s;
  }
  #refresh-btn:hover { background: var(--green2); }
  #loading { display: flex; align-items: center; justify-content: center; height: 300px; flex-direction: column; gap: 16px; }
  .spinner { width: 40px; height: 40px; border: 3px solid var(--border); border-top-color: var(--lime); border-radius: 50%; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  #error-msg { color: var(--red); text-align: center; padding: 40px; display: none; font-size: 0.9rem; }
  #dashboard { display: none; }
  .kpi-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 16px; margin-bottom: 32px; }
  .kpi { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 20px 22px; position: relative; overflow: hidden; animation: fadeUp 0.5s ease both; }
  .kpi::after { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px; background: var(--lime); opacity: 0.5; }
  .kpi-label { font-size: 0.72rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); margin-bottom: 10px; }
  .kpi-value { font-family: 'Bebas Neue', sans-serif; font-size: 2.4rem; line-height: 1; color: var(--lime); }
  .kpi-sub { font-size: 0.75rem; color: var(--muted); margin-top: 6px; }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
  .section-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
  @media (max-width: 900px) { .section-grid { grid-template-columns: 1fr; } }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 24px; animation: fadeUp 0.5s ease both; }
  .card-title { font-family: 'Bebas Neue', sans-serif; font-size: 1.2rem; letter-spacing: 0.08em; color: var(--text); margin-bottom: 20px; display: flex; align-items: center; gap: 10px; }
  .card-title::before { content: ''; display: block; width: 4px; height: 18px; background: var(--lime); border-radius: 2px; flex-shrink: 0; }
  .bar-list { display: flex; flex-direction: column; gap: 12px; }
  .bar-item { display: flex; flex-direction: column; gap: 5px; }
  .bar-meta { display: flex; justify-content: space-between; font-size: 0.82rem; }
  .bar-name { color: var(--text); font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 60%; }
  .bar-val { color: var(--lime); font-family: 'DM Mono', monospace; font-size: 0.78rem; }
  .bar-track { background: var(--card2); border-radius: 4px; height: 8px; overflow: hidden; }
  .bar-fill { height: 100%; background: linear-gradient(90deg, var(--green), var(--lime)); border-radius: 4px; transition: width 0.8s cubic-bezier(0.16,1,0.3,1); }
  .data-table { width: 100%; border-collapse: collapse; font-size: 0.82rem; }
  .data-table th { text-align: left; padding: 8px 12px; font-size: 0.68rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); border-bottom: 1px solid var(--border); }
  .data-table td { padding: 10px 12px; border-bottom: 1px solid rgba(42,61,42,0.5); }
  .data-table tr:last-child td { border-bottom: none; }
  .data-table tr:hover td { background: var(--card2); }
  .pill { display: inline-block; padding: 2px 8px; border-radius: 20px; font-size: 0.68rem; font-weight: 600; letter-spacing: 0.05em; }
  .pill-yes { background: rgba(45,106,45,0.3); color: var(--lime); }
  .pill-no  { background: rgba(224,92,92,0.2); color: var(--red); }
  .donut-wrap { display: flex; align-items: center; gap: 24px; }
  .donut-legend { display: flex; flex-direction: column; gap: 10px; flex: 1; }
  .legend-item { display: flex; align-items: center; gap: 8px; font-size: 0.82rem; }
  .legend-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .legend-label { color: var(--text); flex: 1; }
  .legend-pct { color: var(--muted); font-family: 'DM Mono', monospace; font-size: 0.75rem; }
  .month-row td:first-child { font-family: 'DM Mono', monospace; color: var(--muted); font-size: 0.75rem; }
  .amount { font-family: 'DM Mono', monospace; color: var(--lime); }
  .no-data { color: var(--muted); font-size: 0.82rem; text-align: center; padding: 24px 0; }
</style>
</head>
<body>
<div class="wrapper">
  <header>
    <div class="brand">
      <div class="brand-name">Ojaa <span>Meats</span></div>
      <div class="brand-sub">Business Performance Dashboard</div>
    </div>
    <div class="header-right">
      <span id="last-updated">Not loaded</span>
      <button id="refresh-btn" onclick="loadData()">↻ Refresh</button>
    </div>
  </header>

  <div id="loading"><div class="spinner"></div><span style="color:var(--muted);font-size:0.85rem">Loading your data...</span></div>
  <div id="error-msg"></div>
  <div id="dashboard"></div>
</div>

<script>
const BOT_URL = 'https://ojaa-meats-bot.onrender.com';

async function loadData() {
  document.getElementById('loading').style.display = 'flex';
  document.getElementById('dashboard').style.display = 'none';
  document.getElementById('error-msg').style.display = 'none';
  try {
    const res = await fetch(`${BOT_URL}/dashboard-data`);
    if (!res.ok) throw new Error('Bot returned ' + res.status);
    const { orders, lineItems } = await res.json();
    renderDashboard(orders, lineItems);
    document.getElementById('last-updated').textContent = 'Updated ' + new Date().toLocaleTimeString();
  } catch (err) {
    showError('Could not load data: ' + err.message + '. Make sure the bot is running.');
  } finally {
    document.getElementById('loading').style.display = 'none';
  }
}

function showError(msg) {
  document.getElementById('loading').style.display = 'none';
  const el = document.getElementById('error-msg');
  el.textContent = msg;
  el.style.display = 'block';
}

function fmtZAR(n) { return 'R' + Number(n).toLocaleString('en-ZA', {minimumFractionDigits:0, maximumFractionDigits:0}); }
function fmtNum(n) { return Number(n).toLocaleString('en-ZA'); }

function renderDashboard(orders, lineItems) {
  const totalOrders   = orders.length;
  const totalRevenue  = orders.reduce((s, o) => s + parseFloat(o.Total || 0), 0);
  const paidOrders    = orders.filter(o => (o.Paid||'').toUpperCase() === 'YES');
  const paidRevenue   = paidOrders.reduce((s, o) => s + parseFloat(o.Total || 0), 0);
  const avgOrderVal   = totalOrders ? totalRevenue / totalOrders : 0;
  const uniqueCustomers = new Set(orders.map(o => o.Phone)).size;
  const avgPerCustomer  = uniqueCustomers ? totalRevenue / uniqueCustomers : 0;
  const deliveredOrders = orders.filter(o => (o.Delivered||'').toUpperCase() === 'YES').length;
  const deliveryRate    = totalOrders ? (deliveredOrders / totalOrders * 100).toFixed(0) : 0;

  const deliveryTypes = {};
  orders.forEach(o => { const t = o.Delivery_Type || 'Unknown'; deliveryTypes[t] = (deliveryTypes[t] || 0) + 1; });

  const productStats = {};
  lineItems.forEach(li => {
    const p = li.Product || 'Unknown';
    if (!productStats[p]) productStats[p] = { qty: 0, revenue: 0, orders: new Set() };
    productStats[p].qty     += parseFloat(li.Qty || 0);
    productStats[p].revenue += parseFloat(li.Line_Total || 0);
    if (li.Order_Num) productStats[p].orders.add(li.Order_Num);
  });
  const productList = Object.entries(productStats)
    .map(([name, s]) => ({ name, qty: s.qty, revenue: s.revenue, orders: s.orders.size }))
    .sort((a, b) => b.revenue - a.revenue);

  const customerStats = {};
  orders.forEach(o => {
    const phone = o.Phone || 'Unknown';
    if (!customerStats[phone]) customerStats[phone] = { name: o.Name || phone, orders: 0, spend: 0 };
    customerStats[phone].orders++;
    customerStats[phone].spend += parseFloat(o.Total || 0);
  });
  const customerList = Object.values(customerStats).sort((a, b) => b.spend - a.spend).slice(0, 8);
  const repeatCustomers = Object.values(customerStats).filter(c => c.orders > 1).length;

  const monthlyRevenue = {};
  orders.forEach(o => {
    const d = new Date(o.Timestamp);
    if (isNaN(d)) return;
    const key = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
    if (!monthlyRevenue[key]) monthlyRevenue[key] = { revenue: 0, orders: 0 };
    monthlyRevenue[key].revenue += parseFloat(o.Total || 0);
    monthlyRevenue[key].orders++;
  });
  const monthData = Object.keys(monthlyRevenue).sort().map(k => ({ month: k, ...monthlyRevenue[k] }));
  const recentOrders = [...orders].reverse().slice(0, 8);

  const dash = document.getElementById('dashboard');
  dash.style.display = 'block';
  dash.innerHTML = `
    <div class="kpi-grid">
      ${kpi('Total Orders', fmtNum(totalOrders), 'All time')}
      ${kpi('Total Revenue', fmtZAR(totalRevenue), 'Incl. unpaid')}
      ${kpi('Paid Revenue', fmtZAR(paidRevenue), paidOrders.length + ' paid orders')}
      ${kpi('Avg Order Value', fmtZAR(avgOrderVal), 'Per transaction')}
      ${kpi('Customers', fmtNum(uniqueCustomers), repeatCustomers + ' repeat buyers')}
      ${kpi('Avg Per Customer', fmtZAR(avgPerCustomer), 'Lifetime value')}
      ${kpi('Delivered', deliveryRate + '%', deliveredOrders + ' of ' + totalOrders)}
      ${kpi('Payment Rate', totalOrders ? (paidOrders.length/totalOrders*100).toFixed(0)+'%' : '0%', paidOrders.length + ' confirmed')}
    </div>
    <div class="section-grid">
      <div class="card"><div class="card-title">Monthly Revenue</div>${monthData.length ? monthTable(monthData) : '<p class="no-data">No data yet</p>'}</div>
      <div class="card"><div class="card-title">Delivery Type Split</div>${donut(deliveryTypes)}</div>
    </div>
    <div class="section-grid">
      <div class="card"><div class="card-title">Top Products by Revenue</div>${barChart(productList, 'revenue', v => fmtZAR(v))}</div>
      <div class="card"><div class="card-title">Top Products by Volume</div>${barChart(productList.slice().sort((a,b)=>b.qty-a.qty), 'qty', v => fmtNum(v) + ' units')}</div>
    </div>
    <div class="section-grid">
      <div class="card"><div class="card-title">Top Customers</div>${customerTable(customerList)}</div>
      <div class="card"><div class="card-title">Recent Orders</div>${recentOrdersTable(recentOrders)}</div>
    </div>`;

  setTimeout(() => { document.querySelectorAll('.bar-fill').forEach(el => { el.style.width = el.dataset.width + '%'; }); }, 50);
}

function kpi(label, value, sub) {
  return `<div class="kpi"><div class="kpi-label">${label}</div><div class="kpi-value">${value}</div><div class="kpi-sub">${sub}</div></div>`;
}

function barChart(items, key, fmt) {
  if (!items.length) return '<p class="no-data">No data yet</p>';
  const max = Math.max(...items.map(i => i[key]));
  return `<div class="bar-list">${items.slice(0,8).map(item => {
    const pct = max ? (item[key] / max * 100).toFixed(1) : 0;
    return `<div class="bar-item"><div class="bar-meta"><span class="bar-name">${item.name}</span><span class="bar-val">${fmt(item[key])}</span></div><div class="bar-track"><div class="bar-fill" data-width="${pct}" style="width:0%"></div></div></div>`;
  }).join('')}</div>`;
}

function donut(types) {
  const entries = Object.entries(types).sort((a,b) => b[1]-a[1]);
  const total   = entries.reduce((s,[,v]) => s+v, 0);
  if (!total) return '<p class="no-data">No data yet</p>';
  const colors = ['#a8e063','#2d6a2d','#f0b429','#7a9e7a','#e05c5c'];
  let offset = 0;
  const r = 54, cx = 64, cy = 64, circ = 2 * Math.PI * r;
  const slices = entries.map(([label, val], i) => {
    const pct = val / total;
    const dash = pct * circ;
    const gap  = circ - dash;
    const el   = `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${colors[i%colors.length]}" stroke-width="20" stroke-dasharray="${dash} ${gap}" stroke-dashoffset="${-offset * circ}" transform="rotate(-90 ${cx} ${cy})"/>`;
    offset += pct;
    return el;
  });
  return `<div class="donut-wrap">
    <svg viewBox="0 0 128 128" width="120" height="120" style="flex-shrink:0">
      <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="var(--card2)" stroke-width="20"/>
      ${slices.join('')}
    </svg>
    <div class="donut-legend">${entries.map(([label, val], i) => `
      <div class="legend-item">
        <div class="legend-dot" style="background:${colors[i%colors.length]}"></div>
        <span class="legend-label">${label||'Unknown'}</span>
        <span class="legend-pct">${(val/total*100).toFixed(0)}% (${val})</span>
      </div>`).join('')}
    </div>
  </div>`;
}

function monthTable(data) {
  return `<table class="data-table"><thead><tr><th>Month</th><th>Orders</th><th>Revenue</th></tr></thead>
  <tbody>${data.map(m => `<tr class="month-row"><td>${m.month}</td><td>${m.orders}</td><td class="amount">${fmtZAR(m.revenue)}</td></tr>`).join('')}</tbody></table>`;
}

function customerTable(list) {
  if (!list.length) return '<p class="no-data">No data yet</p>';
  return `<table class="data-table"><thead><tr><th>Customer</th><th>Orders</th><th>Total Spend</th></tr></thead>
  <tbody>${list.map(c => `<tr><td>${c.name||'Unknown'}</td><td>${c.orders}</td><td class="amount">${fmtZAR(c.spend)}</td></tr>`).join('')}</tbody></table>`;
}

function recentOrdersTable(list) {
  if (!list.length) return '<p class="no-data">No data yet</p>';
  return `<table class="data-table"><thead><tr><th>Order</th><th>Total</th><th>Paid</th></tr></thead>
  <tbody>${list.map(o => `<tr><td style="font-family:'DM Mono',monospace;font-size:0.75rem">${o.Order_num||''}</td><td class="amount">${fmtZAR(o.Total)}</td><td><span class="pill ${(o.Paid||'').toUpperCase()==='YES'?'pill-yes':'pill-no'}">${o.Paid||'NO'}</span></td></tr>`).join('')}</tbody></table>`;
}

// Auto-load on page open
loadData();
</script>
</body>
</html>
