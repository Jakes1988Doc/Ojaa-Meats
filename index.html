<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Ojaa Meats &amp; More</title>
  <meta name="description" content="Ojaa Meats &amp; More — premium butchery in Pietermaritzburg. Order boerewors, biltong, dry wors and steak online.">
  <meta name="theme-color" content="#0B0907">

  <!-- The shop lives at /shop/. Anyone landing on the bare domain is sent
       straight there. Three ways, so it works with or without JavaScript:
       the canonical tag for search engines, the meta refresh for the
       browser, and a plain link for anything that ignores both. -->
  <link rel="canonical" href="https://www.ojaameats.com/shop/">
  <meta http-equiv="refresh" content="0; url=/shop/">
  <script>
    /* Instant, and keeps the back button usable by replacing this entry
       rather than stacking one. Any ?query or #hash is carried across. */
    location.replace('/shop/' + location.search + location.hash);
  </script>

  <style>
    :root{ color-scheme: dark; }
    html,body{ height:100%; margin:0; }
    body{
      background:#0B0907; color:#F3E7D3;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
      display:grid; place-items:center; text-align:center; padding:24px;
    }
    h1{ font-size:22px; letter-spacing:.02em; margin:0 0 10px; color:#E8B54B; }
    p{ margin:0 0 22px; color:#A99A82; font-size:15px; }
    a{
      display:inline-block; background:#E8B54B; color:#111; text-decoration:none;
      font-weight:800; padding:14px 26px; border-radius:8px; min-height:48px;
      line-height:20px;
    }
  </style>
</head>
<body>
  <main>
    <h1>Ojaa Meats &amp; More</h1>
    <p>Taking you to the shop&hellip;</p>
    <a href="/shop/">Open the shop</a>
  </main>
</body>
</html>
